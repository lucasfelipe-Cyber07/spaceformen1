<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos - Space for Men</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="contato.css">

</head>
<body>


<header>
    <div class="caixa">
      <h1><img src="./img/logo.png" alt="logo"></h1>
      <nav>
        <ul>
          <li><a href="index.html"> Home</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="contatos.html">Contatos</a></li>
        </ul>
      </nav>
    </div>


  
</header>

<main>
  <form >
    <label for="nomesobrenome">Nome e Sobrenome:</label>
    <input type="text" id="nomesobrenome" class="inputs-padrao" required>
    
    <label for="email">E-mail:</label>
    <input type="email" id="email" class="inputs-padrao" required placeholder="seu.email@exemplo.com">
    
    <label for="telefone">Telefone:</label>
    <input type="tel" id="tel" class="inputs-padrao" required placeholder="(55) 9999-9999">

    <label for="mensagem">Mensagem:</label>
    <textarea name="" id="mensagem" cols="67" rows="10"></textarea>
     <fieldset>

    <legend>Como prefere o nosso contato?</legend>
    
    <label radio for="radio-email"> <input radio type="radio" name="contato" id="radio-email">e-mail</label>
     

    <label radio for="radio-telefone"> <input radio type="radio" name="contato" id="radio-telefone">telefone</label>
     

      <label for="radio-whatsapp"> <input radio type="radio" name="contato" id="radio-whatsapp">WhatsApp</label>
     
     </fieldset>
       
     <fieldset>
     <legend>Qual horário prefere ser atendido?</legend>
     <select name="" id="">
        <option value="">Manhã</option>
        <option value="">Tarde</option>
        <option value="">Noite</option>
               


      </select>
      </fieldset>
     
     
      <label for="chekbox" class="chekbox"><input type="checkbox" id="chekbox">
Gostaria de receber novidades por e-mail?</label>
     
    <input type="submit" value="Enviar" class="enviar">
    

  </form>

 <table>
  
   <thead>
  <tr>
 
  <th>Dia</th>
  <th>Horário</th>

</tr>
   </thead> 


     <tbody>
   <tr>

 
  <td>Segunda-feira</td>
<td>8h ~ 20h </td>
</tr>


<tr>

<td>Quarta-feira</td>
<td>8h ~ 20h </td>
</tr>

<tr>
<td> Sexta-feira</td>
 <td>8h ~ 20h </td>
</tr>



</tbody>
 </table>





</main>

<footer>
    <img src="./img/logo-branco.png" alt="logo-branco">
      <p class="copy">&copy; Copyright barbearia Space For Men </p>

</footer>
    
</body>
</html>
